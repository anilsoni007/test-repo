---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudwatch-logs-viewer
  template:
    metadata:
      labels:
        app: cloudwatch-logs-viewer
    spec:
      serviceAccountName: cloudwatch-logs-viewer-sa
      containers:
      - name: cloudwatch-logs-viewer
        image: 170928836252.dkr.ecr.us-east-1.amazonaws.com/log-shipper:latest
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: COGNITO_REGION
          value: "us-east-1"
        - name: APP_URL
          value: "https://log-shipper-app.170928836252.realhandsonlabs.net"
        - name: COGNITO_DOMAIN
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: COGNITO_DOMAIN
        - name: COGNITO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: COGNITO_CLIENT_ID
        - name: COGNITO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: COGNITO_CLIENT_SECRET
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cognito-secrets
              key: SECRET_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /login
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /login
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

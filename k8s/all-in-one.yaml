---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-logs-viewer-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::113465795713:role/eksctl-soni-cluster-addon-iamserviceaccount-d-Role1-FofoqdtJReQC
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudwatch-logs-viewer
  template:
    metadata:
      labels:
        app: cloudwatch-logs-viewer
    spec:
      serviceAccountName: cloudwatch-logs-viewer-sa
      containers:
      - name: cloudwatch-logs-viewer
        image: 113465795713.dkr.ecr.us-east-1.amazonaws.com/log-shipper:latest
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "us-east-1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  type: ClusterIP
  selector:
    app: cloudwatch-logs-viewer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:113465795713:certificate/72b5b96a-8f10-47b3-9c12-c30c9e9c5c20
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/tags: Environment=production,Application=cloudwatch-logs-viewer
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: '{"userPoolArn":"arn:aws:cognito-idp:us-east-1:113465795713:userpool/us-east-1_ucz7jYwgg","userPoolClientId":"2qtuoc9m910adlv4r2sve90id7","userPoolDomain":"cloudwatch-logs-viewer-113465795713"}'
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-scope: openid
    alb.ingress.kubernetes.io/auth-session-cookie: AWSELBAuthSessionCookie
    alb.ingress.kubernetes.io/auth-session-timeout: '3600'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudwatch-logs-viewer
            port:
              number: 80

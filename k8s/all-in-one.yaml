---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-logs-viewer-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/CloudWatchLogsViewerRole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudwatch-logs-viewer
  template:
    metadata:
      labels:
        app: cloudwatch-logs-viewer
    spec:
      serviceAccountName: cloudwatch-logs-viewer-sa
      containers:
      - name: cloudwatch-logs-viewer
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cloudwatch-logs-viewer:latest
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "us-east-1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  type: NodePort
  selector:
    app: cloudwatch-logs-viewer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/tags: Environment=production,Application=cloudwatch-logs-viewer
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudwatch-logs-viewer
            port:
              number: 80

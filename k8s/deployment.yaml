apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudwatch-logs-viewer
  namespace: default
  labels:
    app: cloudwatch-logs-viewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudwatch-logs-viewer
  template:
    metadata:
      labels:
        app: cloudwatch-logs-viewer
    spec:
      serviceAccountName: cloudwatch-logs-viewer-sa
      containers:
      - name: cloudwatch-logs-viewer
        image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/cloudwatch-logs-viewer:latest
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "us-east-1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
